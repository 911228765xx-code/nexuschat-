<!doctype html>
<html lang="zh-CN" class="dark">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta -->
    <meta name="description" content="NexusChat is an AI-powered Web3 social trading platform. Chat with friends, generate AI research reports, track crypto portfolios, and connect your wallet — all in one place." />
    <meta name="keywords" content="NexusChat, Web3, crypto, AI research, social trading, blockchain, DeFi, chat, wallet" />
    <meta name="author" content="NexusChat" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NexusChat — AI-Powered Web3 Social Trading" />
    <meta property="og:description" content="Chat, research, and trade crypto with AI-powered insights. Connect your wallet and join the Web3 social revolution." />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/icon-512_383ee67d.png" />
    <meta property="og:site_name" content="NexusChat" />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="NexusChat — AI-Powered Web3 Social Trading" />
    <meta name="twitter:description" content="Chat, research, and trade crypto with AI-powered insights. Connect your wallet and join the Web3 social revolution." />
    <meta name="twitter:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/icon-512_383ee67d.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/favicon_57e153e1.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/favicon-32_50148367.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/favicon-16_beb170ec.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/icon-192_44c1362d.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/icon-180_217fb7da.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/icon-152_d89b700a.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663385790517/fYL7bQEV8tj27K63dbYKsc/icon-167_2158f6b3.png" />
    <!-- iOS splash screen meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexusChat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Blocking theme script: prevents white flash before React hydrates -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var theme = (stored === 'light') ? 'light' : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0a0a14';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f5f5f7';
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#0a0a14';
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- Inline splash screen: visible before React mounts, removed when React takes over -->
    <div id="splash-screen" style="
      position: fixed; inset: 0; z-index: 9999;
      background: #0a0a14;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      transition: opacity 0.4s ease;
    ">
      <!-- NexusChat logo icon -->
      <div style="
        width: 72px; height: 72px; border-radius: 20px;
        background: linear-gradient(135deg, #00d4ff, #a855f7);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 40px rgba(0,212,255,0.3), 0 0 80px rgba(168,85,247,0.15);
      ">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <!-- App name -->
      <div style="text-align: center;">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px;">NexusChat</div>
        <div style="font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(0,212,255,0.6); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase;">AI · Web3 · Social</div>
      </div>
      <!-- Loading dots -->
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <div class="splash-dot" style="width: 6px; height: 6px; border-radius: 50%; background: rgba(0,212,255,0.5); animation: splashBounce 0.8s ease-in-out infinite;"></div>
        <div class="splash-dot" style="width: 6px; height: 6px; border-radius: 50%; background: rgba(0,212,255,0.5); animation: splashBounce 0.8s ease-in-out 0.15s infinite;"></div>
        <div class="splash-dot" style="width: 6px; height: 6px; border-radius: 50%; background: rgba(0,212,255,0.5); animation: splashBounce 0.8s ease-in-out 0.3s infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes splashBounce {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
    <script>
      // Remove splash screen once React has mounted
      document.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        var splash = document.getElementById('splash-screen');
        if (!splash) return;
        // Use MutationObserver to detect when React renders content into #root
        var observer = new MutationObserver(function() {
          if (root && root.children.length > 0) {
            observer.disconnect();
            splash.style.opacity = '0';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 400);
          }
        });
        observer.observe(root, { childList: true });
        // Fallback: remove after 5 seconds in case React fails to mount
        setTimeout(function() {
          observer.disconnect();
          if (splash && splash.parentNode) {
            splash.style.opacity = '0';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 400);
          }
        }, 5000);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
