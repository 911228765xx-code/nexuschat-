    <script>
      (function() {
        var splash = document.getElementById('splash-screen');
        var skeleton = document.getElementById('skeleton-screen');
        var root = document.getElementById('root');
        var skeletonShown = false;
        var reactMounted = false;

        function showSkeleton() {
          if (skeletonShown) return;
          skeletonShown = true;
          // Fade out splash, fade in skeleton simultaneously
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 300);
          }
          if (skeleton) {
            skeleton.style.display = 'flex';
            requestAnimationFrame(function() {
              skeleton.style.opacity = '1';
            });
          }
        }

        function hideSkeleton() {
          if (!skeletonShown || reactMounted) return;
          reactMounted = true;
          if (skeleton) {
            skeleton.style.opacity = '0';
            setTimeout(function() {
              if (skeleton && skeleton.parentNode) skeleton.parentNode.removeChild(skeleton);
            }, 200);
          }
        }

        // Show skeleton after JS starts executing (vendor.js downloaded)
        // This replaces the splash as soon as JS is available
        document.addEventListener('DOMContentLoaded', function() {
          // Re-query root here to ensure DOM is fully parsed
          var rootEl = document.getElementById('root');
          root = rootEl;

          // Only hide skeleton when root has meaningful content
          // Use a short delay (300ms) to avoid hiding on loading spinners
          var hideTimer = null;
          var observer = new MutationObserver(function() {
            if (rootEl && rootEl.children.length > 0) {
              // Check if the content is more than just a loading spinner
              // by waiting a short moment for React to settle
              if (hideTimer) clearTimeout(hideTimer);
              hideTimer = setTimeout(function() {
                observer.disconnect();
                hideSkeleton();
              }, 400);
            }
          });

          // Guard: only observe if rootEl is a valid DOM Node
          if (rootEl) {
            observer.observe(rootEl, { childList: true, subtree: true });
          }

          // Fallback: show skeleton after 1.5s if splash is still showing
          setTimeout(showSkeleton, 1500);

          // Hard timeout: remove everything after 8s
          setTimeout(function() {
            observer.disconnect();
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            if (skeleton && skeleton.parentNode) skeleton.parentNode.removeChild(skeleton);
          }, 8000);
        });

        // Expose function for React to call when it's ready
        window.__nexusHideSkeleton = hideSkeleton;
        window.__nexusShowSkeleton = showSkeleton;
      })();
    </script>
